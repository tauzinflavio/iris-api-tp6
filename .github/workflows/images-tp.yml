name: Images v1 et v2 du TP6
on: workflow_dispatch
permissions:
  contents: read
  id-token: write
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Construire et publier les deux versions
        env:
          ACR: ${{ vars.ACR_NAME }}
        run: |
          az acr login --name "$ACR"
          for version in 1 2; do
            image="$ACR.azurecr.io/iris-api:v$version"
            docker build --platform linux/amd64 --build-arg APP_VERSION="$version.0.0" -t "$image" .
            docker push "$image"
          done
